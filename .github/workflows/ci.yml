# Build + lint check on every push — catches breakage before/alongside
# the Vercel deploy. Uses a dummy DATABASE_URL: no page queries the DB at
# build time (DB pages are force-dynamic), prisma generate needs no server.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?sslmode=disable"
      JWT_SECRET: "ci-only-not-a-real-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
